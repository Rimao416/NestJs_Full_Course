version: '3.8'

services:
  dev-db:
    image: postgres:13
    container_name: dev-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
    networks:
      - freecodecamp
    volumes:
      - dev-db-data:/var/lib/postgresql/data

networks:
  freecodecamp:

volumes:
  dev-db-data:
